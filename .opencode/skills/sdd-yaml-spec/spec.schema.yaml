$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
  - spec_version
  - id
  - purpose
  - requirements
properties:
  spec_version:
    const: 1
  id:
    type: string
    minLength: 1
  purpose:
    type: string
    minLength: 1
  requirements:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, when, then]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9-]+$"
        when:
          type: string
          minLength: 1
        then:
          type: string
          minLength: 1
  acceptance:
    type: array
    items:
      type: object
      required: [id, given, when, then]
      properties:
        id: { type: string }
        given: { type: string }
        when: { type: string }
        then: { type: string }

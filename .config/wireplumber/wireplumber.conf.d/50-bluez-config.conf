monitor.bluez.properties = {
  # Force a stable default sample rate for Bluetooth (prevents renegotiation stutters)
  bluez5.default.rate = 48000
}

monitor.bluez.rules = [
  {
    matches = [
      {
        # Matches all Bluetooth audio sink nodes
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        # Prevents the node from sleeping/suspending at startup or during silence
        session.suspend-on-idle = false
        
        # Increases buffer headroom to mitigate early transmission spikes
        api.alsa.headroom = 1024
      }
    }
  }
]

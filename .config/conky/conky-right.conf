-- @description Conky configuration file: displays calendar and todo list


-- Darken the background color of the window.
--------------------------------------------------------------------------------
local p = io.popen([[xrdb -query | awk '$1 == "*color0:" {print $2; exit}']])
local wal_bg = p:read("*l") or "#1d2021"
p:close()

local r, g, b = wal_bg:match("#(%x%x)(%x%x)(%x%x)")
r, g, b = tonumber(r, 16), tonumber(g, 16), tonumber(b, 16)

-- Keep 85% of each channel: a subtle darkening.
local function darker(channel)
    return math.floor(channel * 0.90)
end

local dark_bg = string.format("#%02x%02x%02x", darker(r), darker(g), darker(b))

--------------------------------------------------------------------------------

conky.config = {
    alignment = 'top_right',
    gap_x = 16,
    gap_y = 26,
    minimum_width = 340,
    maximum_width = 1064,

    background = false,
    own_window = true,
    own_window_type = 'override',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    own_window_color = dark_bg,
    own_window_argb_visual = true,
    own_window_argb_value = 220,
    own_window_transparent = false,

    double_buffer = true,
    draw_borders = false,
    draw_shades = false,
    draw_outline = false,
    use_xft = true,
    font = 'FiraCodeNerdFontMono:pixelsize=24:antialias=true',
    text_alpha = 0.5,
    uppercase = false,
    default_color = 'white',
    color1 = 'turquoise',
    update_interval = 30,
    cpu_avg_samples = 2,
    no_buffers = true,
};

conky.text = [[
todo.txt
${hr}

${execi 300 todo.sh -p today | sed '/^--/d' | sed '/^TODO/d'}

Stress:
${execi 300 todo.sh -p stress month 3}

Pacing:
${execi 300 todo.sh -p pace month 3}

Scheduled:
${execi 300 todo.sh -p -x schedule | sed '/^--/d; /^TODO/d' | sed "/t:$(date +%Y-%m-%d)/d" | awk 'match($0, /t:[0-9]{4}-[0-9]{2}-[0-9]{2}/) { print substr($0, RSTART+2, 10) "\t" $0 }' | sort -k1,1 | cut -f2-}

Due:
${execi 300 todo.sh -p -x lsp due: | sed '/^--/d; /^TODO/d; /t:/d' | awk 'match($0, /due:[0-9]{4}-[0-9]{2}-[0-9]{2}/) { print substr($0, RSTART+4, 10) "\t" $0 }' | sort -k1,1 | cut -f2-}

Unscheduled:
${execi 300 todo.sh -p -x ls | sed '/^--/d' | sed '/^TODO/d' | sed '/t:/d' | sed '/due:/d' | head -n 15}
]];

